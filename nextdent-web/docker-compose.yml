# Staging stack: Postgres + one-shot migrations + the app.
# Usage:  cp .env.example .env  &&  docker compose up --build
# (Seeding real data is a separate, secure step — see DEPLOY.md.)

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextdent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: nextdent
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextdent -d nextdent"]
      interval: 5s
      timeout: 5s
      retries: 12

  # applies prisma migrations, then exits (uses the builder image which has the Prisma CLI)
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # the Prisma CLI reads directUrl; the app itself never does
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      NODE_ENV: production
      # clinic timezone — reporting buckets by clinic calendar month (see .env.example)
      TZ: ${TZ:-Asia/Dhaka}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
